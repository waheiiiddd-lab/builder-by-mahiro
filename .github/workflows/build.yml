name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      TODO:
        description: "Action to perform"
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"
      kernelrepo:
        description: "Kernel Repository"
        default: "main"
        type: choice
        options:
          - "main"
          - "rama"
      TCPCONG:
        description: "TCP Congestion Control"
        default: "westwood"
        type: choice
        options:
          - "bbr"
          - "westwood"
      CLANGURL:
        description: "Select Clang Version"
        default: "12"
        type: choice
        options:
          - "12"
          - "19"
          - "20"
          - "22"
          - "zyc"
          - "gf-clang"
      LTOBUILD:
        description: "Setup LTO"
        default: "full"
        type: choice
        options:
          - "full"
          - "thin"
      VARIANT:
        description: "Kernel Variants"
        default: "SUSFS"
        type: choice
        options:
          - "VNL"
          - "KSU"
          - "SUSFS"
          - "ALL"
      CONFIGHZ:
        description: "Custom HZ"
        default: "300"
        type: choice
        options:
          - "250"
          - "300"
          - "500"
          - "1000"
      KERNELBRANCH:
        description: "Kernel Branch (Main Repo)"
        required: true
        default: "lts"
        type: choice
        options:
          - lts
          - test
          - Kinosaki
          - android12-5.10
          - android12-5.10-staging
      KERNELNAME:
        description: "Kernel Name"
        default: "Chelsea"
        type: string

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive
  BASE_NAME: Chelsea
  # Secrets
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ 
          inputs.VARIANT == 'ALL' && fromJson('["KSU","VNL","SUSFS"]') 
          || fromJson(format('["{0}"]', inputs.VARIANT || 'SUSFS')) 
          }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt clean

      - name: Setup Swap 20GB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves cpio aria2 \
            zip unzip libxml2 libxml2-dev device-tree-compiler \
            build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          pip install lxml

      - name: Run Build Script
        env:
          VARIANT: ${{ matrix.variant }}
          KERNELNAME: ${{ inputs.KERNELNAME || 'Chelsea' }}
          REPONYA: ${{ inputs.kernelrepo || 'main' }}
          LTOBUILD: ${{ inputs.LTOBUILD || 'full' }}
          CLANGURL: ${{ inputs.CLANGURL || '12' }}
          TCPCONG: ${{ inputs.TCPCONG || 'westwood' }}
          CONFIGHZ: ${{ inputs.CONFIGHZ || '300' }}
          KERNELBRANCH: ${{ inputs.KERNELBRANCH || 'lts' }}
          TODO: ${{ inputs.TODO || 'kernel' }}
        run: |
          echo "Starting build for variant: $VARIANT"
          chmod +x *.sh
          if [ -d "py" ]; then chmod +x py/*.py; fi
          ./build.sh
